{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="mb-4">Report a Fault</h2>
        
        <form method="POST" action="" enctype="multipart/form-data">
            <!-- We will add CSRF token here later -->
            
            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" name="category" required>
                    <option value="" disabled selected>Select a category...</option>
                    <option value="Pothole">Pothole</option>
                    <option value="Water leak">Water leak</option>
                    <option value="Streetlight">Streetlight</option>
                    <option value="Illegal dumping">Illegal dumping</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="street" class="form-label">Street Name and Nearest Landmark</label>
                <input type="text" class="form-control" id="street" name="street" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description (10 - 500 characters)</label>
                <textarea class="form-control" id="description" name="description" rows="3" required minlength="10" maxlength="500"></textarea>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="reporter_name" class="form-label">Your Name</label>
                    <input type="text" class="form-control" id="reporter_name" name="reporter_name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="reporter_cell" class="form-label">Cell Number (e.g., 0821234567)</label>
                    <input type="tel" class="form-control" id="reporter_cell" name="reporter_cell" required pattern="0[0-9]{9}">
                </div>
            </div>

            <div class="mb-4">
                <label for="photo" class="form-label">Upload a Photo (Optional)</label>
                <input class="form-control" type="file" id="photo" name="photo" accept="image/jpeg, image/png, image/webp">
                <div class="form-text">Max size: 2MB. Accepted formats: JPG, PNG, WEBP.</div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Submit Report</button>
        </form>
    </div>
</div>
{% endblock %}
