{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header-custom py-3">
                <h3 class="mb-0"><i class="fa-solid fa-pen-to-square me-2" style="color: var(--hot-orange);"></i>Report a Fault</h3>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="" enctype="multipart/form-data" id="reportForm">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="mb-4">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select form-select-lg" id="category" name="category" required style="color: white !important;">
                            <option value="" disabled selected style="color: gray;">Select a category...</option>
                            <option value="Pothole" style="color: black;">Pothole</option>
                            <option value="Water leak" style="color: black;">Water leak</option>
                            <option value="Streetlight" style="color: black;">Streetlight</option>
                            <option value="Illegal dumping" style="color: black;">Illegal dumping</option>
                            <option value="Other" style="color: black;">Other</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="street" class="form-label">Street Name and Nearest Landmark</label>
                        <input type="text" class="form-control" id="street" name="street" required placeholder="e.g. 2543 El Gwapo Street">
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">Description (10 - 500 characters)</label>
                        <textarea class="form-control" id="description" name="description" rows="4" required minlength="10" maxlength="500" placeholder="Describe the issue in detail..."></textarea>
                        <div id="descError" class="text-danger mt-1 fw-bold" style="display: none;"></div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="reporter_name" class="form-label">Your Name</label>
                            <input type="text" class="form-control" id="reporter_name" name="reporter_name" required placeholder="John Doe">
                        </div>
                        <div class="col-md-6 mt-4 mt-md-0">
                            <label for="reporter_cell" class="form-label">Cell Number</label>
                            <input type="tel" class="form-control" id="reporter_cell" name="reporter_cell" required pattern="0[0-9]{9}" placeholder="0821234567">
                            <div id="cellError" class="text-danger mt-1 fw-bold" style="display: none;"></div>
                        </div>
                    </div>

                    <div class="mb-5">
                        <label for="photo" class="form-label">Upload a Photo (Optional)</label>
                        <input class="form-control" type="file" id="photo" name="photo" accept="image/jpeg, image/png, image/webp">
                        <div class="form-text">Max size: 2MB. Accepted formats: JPG, PNG, WEBP.</div>
                    </div>

                    <button type="submit" class="btn btn-orange btn-lg w-100 py-3">
                        <i class="fa-solid fa-paper-plane me-2"></i>Submit Report
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
