{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 text-center">
        <div class="card shadow border-top border-4" style="border-top-color: #10b981 !important;">
            <div class="card-body p-5">
                <i class="fa-solid fa-circle-check display-1 text-success mb-3"></i>
                <h2 class="fw-bold mb-3">Report Submitted Successfully!</h2>
                <p class="lead text-muted">Thank you for helping improve Ward 42.</p>
                
                <div class="bg-light rounded p-4 my-4 border">
                    <h5 class="text-muted text-uppercase mb-2">Your Reference Number:</h5>
                    <h1 class="display-4 fw-bold" style="color: var(--sky-blue); letter-spacing: 2px;">{{ reference }}</h1>
                </div>
                
                <p class="mb-4">Please write down this reference number. You can use it to check the status of your report.</p>
                <a href="{{ url_for('main.home') }}" class="btn btn-orange btn-lg px-5">Return to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
