{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header-custom py-3 text-center">
                <h3 class="mb-0"><i class="fa-solid fa-lock me-2" style="color: var(--hot-orange);"></i>Coordinator Login</h3>
            </div>
            <div class="card-body p-5">
                <form method="POST" action="{{ url_for('main.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="mb-4">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required placeholder="Enter username">
                    </div>
                    
                    <div class="mb-5">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
                    </div>
                    
                    <button type="submit" class="btn btn-sky btn-lg w-100 py-3">Login</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
